<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Progress Note Builder</title>
<style>
  :root{
    --paper:#f6f1e9; --card:#fffdf9; --ink:#2c2723; --ink-soft:#6b6258;
    --line:#e3dac9; --clay:#b65a3c; --clay-deep:#9c4a30; --cream:#fdf8f0;
    --sage:#7a8466; --rust:#a23b2a;
    --shadow:0 1px 2px rgba(44,39,35,.06), 0 8px 24px rgba(44,39,35,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.45;padding-bottom:48px;}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px;}
  .preview-bar{position:sticky;top:0;z-index:50;background:rgba(246,241,233,.92);
    backdrop-filter:saturate(140%) blur(8px);-webkit-backdrop-filter:saturate(140%) blur(8px);
    border-bottom:1px solid var(--line);padding:14px 0 12px;}
  .preview-card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:16px 18px;}
  .preview-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
    font-weight:700;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;}
  .note-text{font-family:Iowan Old Style,Palatino,Georgia,serif;font-size:16.5px;line-height:1.6;
    color:var(--ink);max-height:30vh;overflow:auto;white-space:pre-wrap;}
  .note-text .ph{color:var(--clay);font-style:italic;}
  .note-text .risk{color:var(--rust);font-weight:600;}
  .btns{display:flex;gap:8px;margin-top:12px;}
  button.act{border:none;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:700;
    cursor:pointer;transition:.15s;font-family:inherit;}
  .pdf{flex:1.4;background:var(--clay);color:var(--cream);}
  .pdf:active{background:var(--clay-deep);transform:translateY(1px);}
  .copy{flex:1;background:#efe7d8;color:var(--ink);}
  .copy:active{transform:translateY(1px);}
  .copy.done,.pdf.done{background:var(--sage);color:#fff;}
  .reset{background:transparent;color:var(--ink-soft);border:1px solid var(--line) !important;flex:0 0 auto;padding:13px 14px;}
  .reset:active{background:#efe7d8;}
  header.top{padding:22px 0 6px;}
  header.top h1{font-family:Iowan Old Style,Palatino,Georgia,serif;font-size:23px;font-weight:600;margin:0;letter-spacing:-.01em;}
  header.top p{margin:4px 0 0;color:var(--ink-soft);font-size:13.5px;}
  details.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:14px 0;
    box-shadow:var(--shadow);overflow:hidden;}
  details.sec.risky{border-color:#e8c7bd;}
  details.sec>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;
    justify-content:space-between;font-family:Iowan Old Style,Palatino,Georgia,serif;font-size:18px;font-weight:600;}
  details.sec>summary::-webkit-details-marker{display:none;}
  .chev{transition:.2s;color:var(--ink-soft);font-size:14px;}
  details.sec[open] .chev{transform:rotate(180deg);}
  .sec-body{padding:2px 18px 18px;}
  .grp{margin:14px 0 0;}.grp:first-child{margin-top:4px;}
  .grp-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin:0 0 9px;}
  .grp-label.mod{color:var(--clay-deep);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 15px;
    font-size:15px;cursor:pointer;transition:.12s;user-select:none;min-height:42px;display:inline-flex;align-items:center;font-family:inherit;}
  .chip:active{transform:scale(.97);}
  .chip.on{background:var(--clay);border-color:var(--clay);color:var(--cream);font-weight:600;}
  .chip.single.on{background:var(--ink);border-color:var(--ink);}
  .chip.risk-on{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:600;}
  .subgrp{margin-top:14px;padding:12px 14px;background:#fbf6ee;border:1px solid var(--line);border-radius:13px;}
  .subgrp .grp-label{margin-top:0;}
  .field{margin-top:6px;}
  .field textarea,.field input[type=text],.field input[type=date],.field input[type=time]{
    width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15.5px;
    font-family:inherit;color:var(--ink);background:#fff;line-height:1.4;}
  .field textarea{resize:vertical;min-height:46px;}
  .field textarea::placeholder{color:#b6ab9a;}
  .row2{display:flex;gap:10px;}.row2>div{flex:1;}
  .footer{text-align:center;color:var(--ink-soft);font-size:12px;margin:26px 0 0;line-height:1.6;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);
    color:var(--cream);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:99;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #printDoc{display:none;}
  @media print{
    .preview-bar,header.top,#form,.footer,.toast{display:none !important;}
    body{background:#fff;color:#000;padding:0;}
    #printDoc{display:block !important;font-family:Iowan Old Style,Palatino,Georgia,serif;
      font-size:12.5pt;line-height:1.55;color:#000;padding:0;max-width:100%;}
    #printDoc h2{font-size:13.5pt;letter-spacing:.04em;text-transform:uppercase;margin:0 0 4pt;}
    #printDoc .attest{font-size:10.5pt;line-height:1.4;border:1px solid #000;padding:8pt 10pt;border-radius:4pt;margin:0 0 14pt;}
    #printDoc .body p{margin:0 0 10pt;text-align:justify;}
    #printDoc .sig{border-top:1px solid #000;padding-top:8pt;margin-top:24pt;font-size:11pt;line-height:1.55;}
    #printDoc .sig .name{font-weight:700;}
    @page{margin:0.9in;}
  }
</style>
</head>
<body>

<div class="preview-bar">
  <div class="wrap">
    <div class="preview-card">
      <div class="preview-label"><span>Live note</span><span id="wc">0 words</span></div>
      <div class="note-text" id="note"></div>
      <div class="btns">
        <button class="act pdf" id="pdfBtn">Save as PDF</button>
        <button class="act copy" id="copyBtn">Copy text</button>
        <button class="act reset" id="resetBtn">Reset</button>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <h1>Progress Note Builder</h1>
    <p>Tap what applies, then Save as PDF and upload. Remembers your last session.</p>
  </header>
  <div id="form"></div>
  <p class="footer">Runs entirely on this device — nothing is sent or stored online.<br>
    No client identifiers.</p>
</div>

<div id="printDoc"></div>
<div class="toast" id="toast">Copied</div>

<script>
/* ===== EASILY UPDATABLE CONFIG ===== */
const DEFAULTS = {
  attest:"I confirm that the client agreed for this visit to occur via telehealth. The client's full name and address of their physical location was confirmed at the start of the session and the client is located in the state where I am licensed to practice.\nI confirm that the client is clinically appropriate for service delivery via telehealth.",
  closing:"Symptoms of the client's diagnosis persist and continue to impact the quality of the client's life and functioning across multiple domains. Individual psychotherapy remains medically necessary to alleviate and reduce symptoms, support progress toward treatment goals, and improve the client's quality of life and functioning. Client is scheduled to return.",
  provider:"La Gronseth, MS, LPCC\nPsychotherapist\nBoard Approved Supervisor"
};

const CONFIG = [
  { title:"Setting & orientation", open:true, groups:[
    { id:"setting", label:"Location of service", type:"single", options:[
      {v:"telehealth", t:"Telehealth (MN residence)", def:true},
      {v:"inperson", t:"In person / office"},
      {v:"phone", t:"Telephone (MN residence)"},
    ]},
    { id:"orientation", label:"Orientation", type:"single", options:[
      {v:"a&ox4", t:"Alert & oriented x4", def:true},
      {v:"a&ox3", t:"Alert & oriented to person, place & time"},
      {v:"mild", t:"Oriented, mild impairment noted"},
    ]},
  ]},
  { title:"Presentation", open:true, focusField:true, groups:[
    { id:"sympMood", label:"Mood", type:"multi", options:[
      {v:"variable mood",t:"variable mood"},{v:"depressed mood",t:"depressed mood"},{v:"low mood",t:"low mood"},
      {v:"flat affect",t:"flat affect"},{v:"irritability",t:"irritability"},{v:"mood swings",t:"mood swings"},
    ]},
    { id:"sympAnx", label:"Anxiety", type:"multi", options:[
      {v:"anxiety",t:"anxiety"},{v:"excessive worry",t:"worry"},
      {v:"restlessness",t:"restlessness"},{v:"hypervigilance",t:"hypervigilance"},
    ]},
    { id:"sympCog", label:"Cognitive", type:"multi", options:[
      {v:"difficulty concentrating",t:"poor concentration"},{v:"racing thoughts",t:"racing thoughts"},
      {v:"intrusive thoughts",t:"intrusive thoughts"},{v:"rumination",t:"rumination"},
    ]},
    { id:"sympOther", label:"Behavioral / physical / sleep", type:"multi", options:[
      {v:"social withdrawal",t:"social withdrawal"},{v:"decreased interest",t:"decreased interest"},
      {v:"agitation",t:"agitation"},{v:"fatigue",t:"fatigue"},
      {v:"appetite changes",t:"appetite changes"},{v:"sleep disturbance",t:"sleep disturbance"},
    ]},
    { id:"concern", label:"Addressed these concerns", type:"multi", options:[
      {v:"emotional",t:"emotional"},{v:"interpersonal",t:"interpersonal"},
      {v:"relational",t:"relational"},{v:"adjustment",t:"adjustment"},
      {v:"social",t:"social"},{v:"occupational",t:"occupational"},
    ]},
  ]},
  { title:"Severity & functioning", open:false, groups:[
    { id:"severity", label:"These symptoms affect functioning at a", type:"single", options:[
      {v:"mild",t:"mild"},{v:"moderate",t:"moderate", def:true},{v:"severe",t:"severe"},
    ]},
    { id:"domains", label:"...level across these domains", type:"multi", options:[
      {v:"emotional",t:"emotional"},{v:"social",t:"social"},{v:"occupational",t:"occupational"},
      {v:"executive",t:"executive"},{v:"relational",t:"relational"},{v:"daily functioning",t:"daily functioning"},
    ]},
  ]},
  { title:"Risk & crisis", open:true, risky:true, custom:"risk", groups:[] },
  { title:"Intervention", open:true, custom:"intervention", groups:[
    { id:"purpose", label:"...in order to", type:"multi", options:[
      {v:"address concerns",t:"address concerns"},{v:"reduce symptoms",t:"reduce symptoms"},
      {v:"build mastery",t:"build mastery"},{v:"sustain progress",t:"sustain progress"},
    ]},
  ]},
  { title:"Response & plan", open:true, groups:[
    { id:"response", label:"Client responded to these interventions", type:"single", options:[
      {v:"with meaningful engagement",t:"meaningful engagement", def:true},
      {v:"positively",t:"positively"},{v:"with openness",t:"with openness"},
      {v:"with compliance",t:"with compliance"},{v:"with ambivalence",t:"with ambivalence"},
      {v:"with some resistance",t:"with some resistance"},
    ]},
    { id:"homework", label:"Client agreed to", type:"multi", options:[
      {v:"further engage with the skills outlined in this session",t:"engage w/ session skills", def:true},
      {v:"continue between-session practice",t:"continue practice"},
      {v:"monitor mood and warning signs",t:"monitor mood"},
      {v:"utilize identified supports",t:"use supports"},
      {v:"apply communication strategies discussed",t:"apply communication strategies"},
    ]},
  ]},
  { title:"Progress & treatment plan", open:true, groups:[
    { id:"progressAssess", label:"Overall assessment", type:"single", options:[
      {v:"is working toward goals",t:"working toward goals", def:true},
      {v:"has partially achieved goals",t:"partially achieved"},
      {v:"has achieved goals and is in maintenance",t:"achieved / maintenance"},
      {v:"has resolved this goal",t:"resolved"},
      {v:"is worsening",t:"worsening"},
      {v:"shows no progress",t:"no progress"},
    ]},
    { id:"evidence", label:"As evidenced by", type:"multi", options:[
      {v:"improved mood",t:"improved mood"},{v:"reduced symptoms",t:"reduced symptoms"},
      {v:"improved communication",t:"improved communication"},{v:"improved relationships",t:"improved relationships"},
      {v:"enhanced coping skills",t:"enhanced coping"},{v:"increased engagement",t:"increased engagement"},
      {v:"increased client insight",t:"increased insight"},{v:"greater independence",t:"more independence"},
      {v:"increased interpersonal conflict",t:"increased conflict"},{v:"decreased coping",t:"decreased coping"},
      {v:"a relapse of symptoms",t:"symptom relapse"},
    ]},
    { id:"planReview", label:"Treatment plan", type:"single", options:[
      {v:"none",t:"Reviewed, no updates", def:true},
      {v:"updated",t:"Reviewed & updated"},
      {v:"skip",t:"Not reviewed"},
    ]},
  ]},
  { title:"Document & signature", open:false, custom:"document", groups:[] },
];

const MODALITIES = [
  { v:"compassion focused therapy", t:"Compassion Focused", interventions:[
    {v:"self-compassion practice"},{v:"soothing-system activation"},{v:"compassionate reframing"},{v:"imagery for self-soothing"},]},
  { v:"emotionally focused therapy", t:"Emotionally Focused", interventions:[
    {v:"emotion identification and deepening"},{v:"accessing primary emotion"},{v:"processing of emotional experience"},{v:"attachment-based reframing"},]},
  { v:"motivational interviewing", t:"Motivational Interviewing", interventions:[
    {v:"evoking change talk"},{v:"affirming client autonomy"},{v:"exploration of ambivalence"},{v:"rolling with resistance"},]},
  { v:"narrative therapy", t:"Narrative", interventions:[
    {v:"externalizing the concern"},{v:"re-authoring a preferred narrative"},{v:"identifying unique outcomes"},]},
  { v:"interpersonal therapy", t:"Interpersonal", interventions:[
    {v:"clarifying interpersonal patterns"},{v:"communication analysis"},{v:"exploration of role transitions"},]},
  { v:"person-centered therapy", t:"Person-Centered", interventions:[
    {v:"reflective listening"},{v:"empathic attunement"},{v:"unconditional positive regard"},]},
  { v:"internal family systems", t:"Internal Family Systems", interventions:[
    {v:"somatic tracking of parts in the body"},{v:"unblending through grounding and breath"},
    {v:"accessing Self-energy"},{v:"befriending a protective part"},]},
];
const GENERAL = [
  {v:"psychoeducation"},{v:"skills introduction"},{v:"skills practice"},
  {v:"strength-based reflection"},{v:"motivational enhancement"},{v:"narrative processing"},
];
const RISK_TYPES=[
  {v:"passive suicidal ideation"},{v:"active suicidal ideation"},
  {v:"homicidal ideation"},{v:"self-harm urges"},{v:"acute distress or crisis"},
];
const RISK_ACTIONS=[
  {v:"collaborative safety planning"},{v:"review of an existing safety plan"},
  {v:"identification of natural and community supports"},{v:"review of crisis resources"},
  {v:"an agreement to increased contact and follow-up"},
];

/* ===== state ===== */
const state={};
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function applyDefaults(){
  CONFIG.forEach(s=>s.groups.forEach(g=>{
    if(g.type==="single"){const d=g.options.find(o=>o.def);state[g.id]=d?d.v:g.options[0].v;}
    else state[g.id]=g.options.filter(o=>o.def).map(o=>o.v);
  }));
  state.focus="";state.modality=[];state.interventions=[];state.general=[];
  state.risk="none";state.riskTypes=[];state.riskActions=[];
  state.attest=DEFAULTS.attest;state.closing=DEFAULTS.closing;state.provider=DEFAULTS.provider;
  state.dos=todayISO();state.time="";
}
function saveState(){try{localStorage.setItem("pnb_v2",JSON.stringify(state));}catch(e){}}
function loadState(){try{const s=localStorage.getItem("pnb_v2");if(s)Object.assign(state,JSON.parse(s));}catch(e){}}

/* ===== render ===== */
const form=document.getElementById("form");
function buildForm(){
  form.innerHTML="";
  CONFIG.forEach(sec=>{
    const d=document.createElement("details"); d.className="sec"+(sec.risky?" risky":"");
    if(sec.open)d.open=true;
    d.innerHTML=`<summary>${sec.title}<span class="chev">▾</span></summary>`;
    const body=document.createElement("div"); body.className="sec-body";
    if(sec.focusField){
      const f=document.createElement("div");f.className="grp";
      f.innerHTML=`<div class="grp-label">Focus of session</div>
        <div class="field"><textarea id="focus" rows="1" placeholder="Optional: focus / topic of session"></textarea></div>`;
      body.appendChild(f);
    }
    if(sec.custom==="intervention") renderIntervention(body);
    else if(sec.custom==="risk") renderRisk(body);
    else if(sec.custom==="document") renderDocument(body);
    sec.groups.forEach(g=>body.appendChild(genericGroup(g)));
    d.appendChild(body); form.appendChild(d);
  });
  const fx=document.getElementById("focus");
  if(fx){fx.value=state.focus;fx.addEventListener("input",e=>{state.focus=e.target.value;render();});}
}
function genericGroup(g){
  const grp=document.createElement("div");grp.className="grp";
  grp.innerHTML=`<div class="grp-label">${g.label}</div>`;
  const chips=document.createElement("div");chips.className="chips";
  g.options.forEach(o=>{
    const c=document.createElement("div");c.className="chip"+(g.type==="single"?" single":"");c.textContent=o.t;
    const sel=g.type==="single"?state[g.id]===o.v:state[g.id].includes(o.v);if(sel)c.classList.add("on");
    c.addEventListener("click",()=>{
      if(g.type==="single"){state[g.id]=o.v;chips.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");}
      else{const a=state[g.id],i=a.indexOf(o.v);if(i>=0){a.splice(i,1);c.classList.remove("on");}else{a.push(o.v);c.classList.add("on");}}
      render();
    });
    chips.appendChild(c);
  });
  grp.appendChild(chips);return grp;
}
function renderIntervention(body){
  const modGrp=document.createElement("div");modGrp.className="grp";
  modGrp.innerHTML=`<div class="grp-label">Modality used</div>`;
  const modChips=document.createElement("div");modChips.className="chips";
  MODALITIES.forEach(m=>{
    const c=document.createElement("div");c.className="chip";c.textContent=m.t;
    if(state.modality.includes(m.v))c.classList.add("on");
    c.addEventListener("click",()=>{
      const i=state.modality.indexOf(m.v);
      if(i>=0){state.modality.splice(i,1);c.classList.remove("on");
        state.interventions=state.interventions.filter(v=>!m.interventions.some(x=>x.v===v));}
      else{state.modality.push(m.v);c.classList.add("on");}
      drawInterventions();render();
    });
    modChips.appendChild(c);
  });
  modGrp.appendChild(modChips);body.appendChild(modGrp);
  const ivWrap=document.createElement("div");ivWrap.id="ivWrap";body.appendChild(ivWrap);
  function drawInterventions(){
    ivWrap.innerHTML="";
    state.modality.forEach(mv=>{
      const m=MODALITIES.find(x=>x.v===mv);if(!m)return;
      const sg=document.createElement("div");sg.className="subgrp";
      sg.innerHTML=`<div class="grp-label mod">${m.t} — facilitated</div>`;
      const cc=document.createElement("div");cc.className="chips";
      m.interventions.forEach(iv=>{
        const c=document.createElement("div");c.className="chip";c.textContent=iv.v;
        if(state.interventions.includes(iv.v))c.classList.add("on");
        c.addEventListener("click",()=>{const i=state.interventions.indexOf(iv.v);
          if(i>=0){state.interventions.splice(i,1);c.classList.remove("on");}
          else{state.interventions.push(iv.v);c.classList.add("on");}render();});
        cc.appendChild(c);
      });
      sg.appendChild(cc);ivWrap.appendChild(sg);
    });
    const sg=document.createElement("div");sg.className="subgrp";
    sg.innerHTML=`<div class="grp-label">General clinical actions</div>`;
    const cc=document.createElement("div");cc.className="chips";
    GENERAL.forEach(iv=>{
      const c=document.createElement("div");c.className="chip";c.textContent=iv.v;
      if(state.general.includes(iv.v))c.classList.add("on");
      c.addEventListener("click",()=>{const i=state.general.indexOf(iv.v);
        if(i>=0){state.general.splice(i,1);c.classList.remove("on");}
        else{state.general.push(iv.v);c.classList.add("on");}render();});
      cc.appendChild(c);
    });
    sg.appendChild(cc);ivWrap.appendChild(sg);
  }
  drawInterventions();
}
function renderRisk(body){
  const g=document.createElement("div");g.className="grp";
  g.innerHTML=`<div class="grp-label">Risk / crisis status</div>`;
  const chips=document.createElement("div");chips.className="chips";
  [{v:"none",t:"None suspected / disclosed"},{v:"denied",t:"Denied when assessed"},{v:"present",t:"Risk present"}].forEach(o=>{
    const c=document.createElement("div");c.className="chip single";c.textContent=o.t;
    if(state.risk===o.v)c.classList.add(o.v==="present"?"risk-on":"on");
    c.addEventListener("click",()=>{state.risk=o.v;buildForm();render();});
    chips.appendChild(c);
  });
  g.appendChild(chips);body.appendChild(g);
  if(state.risk==="present"){
    const mk=(title,list,key,cls)=>{
      const w=document.createElement("div");w.className="subgrp";
      w.innerHTML=`<div class="grp-label">${title}</div>`;
      const cc=document.createElement("div");cc.className="chips";
      list.forEach(o=>{const c=document.createElement("div");c.className="chip";c.textContent=o.v;
        if(state[key].includes(o.v))c.classList.add(cls);
        c.addEventListener("click",()=>{const a=state[key],i=a.indexOf(o.v);
          if(i>=0){a.splice(i,1);c.classList.remove(cls);}else{a.push(o.v);c.classList.add(cls);}render();});
        cc.appendChild(c);});
      w.appendChild(cc);body.appendChild(w);
    };
    mk("Client reported",RISK_TYPES,"riskTypes","risk-on");
    mk("Clinician responded with",RISK_ACTIONS,"riskActions","on");
  }
}
function renderDocument(body){
  const w=document.createElement("div");w.className="grp";
  w.innerHTML=`
    <div class="row2">
      <div><div class="grp-label">Date of service</div><div class="field"><input type="date" id="dos"></div></div>
      <div><div class="grp-label">Time (optional)</div><div class="field"><input type="time" id="time"></div></div>
    </div>
    <div class="grp"><div class="grp-label">Provider / signature (one per line)</div>
      <div class="field"><textarea id="provider" rows="3"></textarea></div></div>
    <div class="grp"><div class="grp-label">Telehealth attestation (top of PDF)</div>
      <div class="field"><textarea id="attest" rows="5"></textarea></div></div>
    <div class="grp"><div class="grp-label">Closing statement</div>
      <div class="field"><textarea id="closing" rows="4"></textarea></div></div>`;
  body.appendChild(w);
  const bind=(id,key)=>{const el=document.getElementById(id);el.value=state[key]||"";
    el.addEventListener("input",e=>{state[key]=e.target.value;render();});};
  bind("dos","dos");bind("time","time");bind("provider","provider");bind("attest","attest");bind("closing","closing");
}

/* ===== assembly ===== */
function joinList(a){a=a.filter(Boolean);if(!a.length)return"";if(a.length===1)return a[0];
  if(a.length===2)return a[0]+" and "+a[1];return a.slice(0,-1).join(", ")+", and "+a[a.length-1];}
const PH=t=>`<span class="ph">[${t}]</span>`;

function buildNote(html){
  const S=state,ph=t=>html?PH(t):"["+t+"]";
  const P1=[],P2=[],P3=[];
  if(S.setting==="telehealth")P1.push("Client appeared for this telehealth appointment from their Minnesota residence.");
  else if(S.setting==="phone")P1.push("Client attended this appointment by telephone from their Minnesota residence.");
  else P1.push("Client attended this appointment in person.");
  const ori={"a&ox4":"alert and oriented x4","a&ox3":"alert and oriented to person, place, and time","mild":"oriented with mild impairment noted"}[S.orientation];
  P1.push("Client presented as "+ori+".");
  if(S.focus&&S.focus.trim())P1.push("Session focused on "+S.focus.trim().replace(/\.$/,"")+".");
  const symps=[...S.sympMood,...S.sympAnx,...S.sympCog,...S.sympOther];
  let l3="Client reported "+(symps.length?joinList(symps):ph("symptoms"));
  if(S.concern.length)l3+=" and addressed these "+joinList(S.concern)+" concerns in session with the clinician";
  P1.push(l3+".");
  if(S.domains.length)P1.push("These symptoms affect client functioning at a "+S.severity+" level across "+joinList(S.domains)+" domains.");
  else P1.push("These symptoms affect client functioning at a "+S.severity+" level.");
  if(S.risk==="none"){const s="No suicidal or homicidal ideation, risk, or crisis was suspected or disclosed.";P1.push(html?`<span class="risk">${s}</span>`:s);}
  else if(S.risk==="denied"){const s="Client denied suicidal and homicidal ideation when assessed.";P1.push(html?`<span class="risk">${s}</span>`:s);}
  else{let r="Client reported "+(S.riskTypes.length?joinList(S.riskTypes):ph("risk concern"))+".";
    if(S.riskActions.length)r+=" Clinician responded with "+joinList(S.riskActions)+".";P1.push(html?`<span class="risk">${r}</span>`:r);}

  const mod=S.modality.length?joinList(S.modality):ph("modality");
  const acts=[...S.interventions,...S.general];const act=acts.length?joinList(acts):ph("interventions");
  let l5="Using "+mod+", the clinician facilitated "+act;
  if(S.purpose.length)l5+=" to "+joinList(S.purpose);
  P2.push(l5+".");
  P2.push("Client responded to these interventions "+S.response+".");

  if(S.homework.length)P3.push("Client agreed to "+joinList(S.homework)+".");
  let p="Progress reflects that the client "+S.progressAssess;
  if(S.evidence.length)p+=", as evidenced by "+joinList(S.evidence);
  P3.push(p+".");
  if(S.planReview==="none")P3.push("The treatment plan was reviewed this session; no updates were needed.");
  else if(S.planReview==="updated")P3.push("The treatment plan was reviewed and updated this session.");

  const paras=[P1,P2,P3].filter(a=>a.length).map(a=>a.join(" "));
  if(S.closing&&S.closing.trim())paras.push(S.closing.trim());
  return paras.join("\n\n");
}
function fmtDate(iso){if(!iso)return"";const[y,m,d]=iso.split("-");const mo=["January","February","March","April","May","June","July","August","September","October","November","December"][+m-1];return mo+" "+(+d)+", "+y;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function nl2br(s){return esc(s).replace(/\n/g,"<br>");}

/* ===== preview + print ===== */
const noteEl=document.getElementById("note"),wcEl=document.getElementById("wc"),printDoc=document.getElementById("printDoc");
function render(){
  noteEl.innerHTML=buildNote(true);
  const words=buildNote(false).replace(/\[.*?\]/g,"").trim().split(/\s+/).filter(Boolean).length;
  wcEl.textContent=words+" words";
  const dline=fmtDate(state.dos)+(state.time?(" at "+state.time):"");
  const bodyHtml=buildNote(false).split("\n\n").map(p=>`<p>${esc(p)}</p>`).join("");
  const provLines=(state.provider||"").split("\n");
  const provHtml=provLines.map((l,i)=>i===0?`<div class="name">${esc(l)}</div>`:`<div>${esc(l)}</div>`).join("");
  printDoc.innerHTML=
    `<h2>Psychotherapy Progress Note</h2>`+
    (state.attest?`<div class="attest">${nl2br(state.attest)}</div>`:"")+
    `<div class="body">${bodyHtml}</div>`+
    `<div class="sig">${provHtml}<div>Date of service: ${dline||"__________"}</div>
       <div>Signature: ____________________________</div></div>`;
  saveState();
}
document.getElementById("pdfBtn").addEventListener("click",()=>{window.print();});
const copyBtn=document.getElementById("copyBtn");
copyBtn.addEventListener("click",async()=>{
  const txt=buildNote(false);
  try{await navigator.clipboard.writeText(txt);}
  catch(e){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();}
  copyBtn.textContent="Copied ✓";copyBtn.classList.add("done");toast("Note text copied");
  setTimeout(()=>{copyBtn.textContent="Copy text";copyBtn.classList.remove("done");},1400);
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("Clear all selections and your saved last session?"))return;
  try{localStorage.removeItem("pnb_v2");}catch(e){}
  applyDefaults();buildForm();render();toast("Reset to defaults");
});
const toastEl=document.getElementById("toast");let tt;
function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),1300);}

applyDefaults();loadState();state.dos=todayISO();state.time="";
buildForm();render();
</script>
